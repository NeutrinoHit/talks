name: Build talks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: talks-pdf
          path: dist/*.pdf
