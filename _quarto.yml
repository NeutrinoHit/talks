project:
  type: website
  output-dir: _site
  resources:
    - "shared/reveal/**"
    - "shared/styles/**"
    - "shared/figures/**"
    - "styles/**"
    - "georgia-2026/media/**"
    - "georgia-2026/assets/**"
    - "neutrino-telescopes-2026/media/**"
    - "neutrino-telescopes-2026/assets/**"
    - "!neutrino-telescopes-2026/assets/reconstruction/__pycache__/**"
  render:
    - "protvino-2026/dnaumov.qmd"
    - "georgia-2026/dnaumov.qmd"
    - "georgia-2026/dnaumov-35min.qmd"
    # Temporarily disabled; keep the explicit exclusion for shared validation.
    - "!modular-symmetry/lecture.qmd"
    - "neutrino-telescopes-2026/lecture.qmd"

format:
  revealjs:
    theme: black
    logo: shared/figures/dvnlogo.png
    include-after-body:
      - analytics/cloudflare-web-analytics.html
    embed-resources: false
    slide-number: true
    slide-level: 2
    toc: false
    width: 1280
    height: 720
    margin: 0.06
    transition: fade
    center: false
    incremental: false
    chalkboard: false
    preview-links: false

execute:
  echo: false
  warning: false
  message: false
