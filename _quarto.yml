project:
  type: website
  output-dir: _site
  resources:
    - "shared/reveal/**"
    - "shared/figures/**"
    - "styles/**"
    - "protvino-2026/media/**"
  render:
    - "protvino-2026/dnaumov.qmd"

format:
  revealjs:
    theme: black
    css: styles/reveal-dark.css
    logo: shared/figures/dvnlogo.png
    include-after-body:
      - text: |
          <script data-external="1" data-context-home="https://neutrinohit.github.io/ru/research.html#talk-protvino-2026" data-context-home-label="Карта доклада" src="../shared/reveal/neutrinohit-reveal-footer.js"></script>
      - analytics/cloudflare-web-analytics.html
    embed-resources: true
    slide-number: true
    slide-level: 2
    toc: false
    width: 1280
    height: 720
    margin: 0.06
    transition: fade
    center: false
    incremental: false
    chalkboard: false
    preview-links: false

execute:
  echo: false
  warning: false
  message: false
