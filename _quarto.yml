project:
  type: website
  output-dir: _site
  render:
    - "protvino-2026/index.qmd"

format:
  revealjs:
    theme: black
    css: styles/reveal-dark.css
    logo: shared/figures/dvnlogo.png
    footer: |
      <nav class="nh-slide-footer" aria-label="Social links">
        <a class="nh-footer-link" href="https://t.me/NeutrinoHit" target="_blank" rel="noopener" aria-label="Telegram">
          <svg viewBox="0 0 48 48" role="img" aria-hidden="true">
            <circle cx="24" cy="24" r="21"></circle>
            <path d="M38.8 12.1 33.4 37c-.4 1.8-1.5 2.3-3.1 1.4l-8.5-6.3-4.1 4c-.5.5-.8.8-1.7.8l.6-8.7 15.9-14.4c.7-.6-.2-1-1.1-.4L11.7 26.8l-8.5-2.7c-1.8-.6-1.8-1.8.4-2.6L36.7 8.7c1.5-.6 2.8.3 2.1 3.4z"></path>
          </svg>
        </a>
        <a class="nh-footer-link" href="https://www.youtube.com/@dmitrynaumov6099/" target="_blank" rel="noopener" aria-label="YouTube">
          <svg viewBox="0 0 48 48" role="img" aria-hidden="true">
            <rect x="6" y="12" width="36" height="24" rx="8"></rect>
            <path d="M21 18l12 6-12 6z"></path>
          </svg>
        </a>
      </nav>
    embed-resources: true
    slide-number: true
    slide-level: 2
    toc: false
    width: 1280
    height: 720
    margin: 0.06
    transition: fade
    center: false
    incremental: false
    chalkboard: false
    preview-links: false

execute:
  echo: false
  warning: false
  message: false
