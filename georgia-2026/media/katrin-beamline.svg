or="middle" font-weight="normal"><tspan x="1440.0" dy="0">Кремниевый</tspan><tspan x="1440.0" dy="35.1">детектор</tspan></text><path d="M245,200 L303,200" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M575,200 L633,200" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M905,200 L963,200" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><path d="M1275,200 L1333,200" fill="none" stroke="#7cc7ff" stroke-width="3" marker-end="url(#arrow)"/><text x="130" y="90" fill="#7cc7ff" font-family="DejaVu Sans, sans-serif" font-size="27" text-anchor="middle" font-weight="normal"><tspan x="130" dy="0">β-распад</tspan></text><text x="440" y="90" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="26" text-anchor="middle" font-weight="normal"><tspan x="440" dy="0">электроны проходят</tspan></text><text x="1120" y="90" fill="#ffcc8a" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="1120" dy="0">порог e|U|</tspan></text><text x="1440" y="90" fill="#ff9ab0" font-family="DejaVu Sans, sans-serif" font-size="28" text-anchor="middle" font-weight="normal"><tspan x="1440" dy="0">число n</tspan></text><path d="M440,262 L440,330" fill="none" stroke="#75ddb8" stroke-width="3" marker-end="url(#arrow)"/><text x="440" y="373" fill="#75ddb8" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="440" dy="0">газ → очистка → возврат</tspan></text><text x="900" y="365" fill="#b8c7d1" font-family="DejaVu Sans, sans-serif" font-size="25" text-anchor="middle" font-weight="normal"><tspan x="900" dy="0">Схема не в масштабе; длина установки ≈ 70 м.</tspan></text></svg>
