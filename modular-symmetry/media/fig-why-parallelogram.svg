<line x1="890.3" y1="271.8" x2="901.4" y2="243.9" stroke="#ffcc8a" stroke-width="4" marker-end="url(#aha)"/>
<text x="750.0" y="60.0" fill="#8be0a4" font-size="30" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">Параллелограмм</text>
<text x="750.0" y="405.0" fill="#e9f1f4" font-size="24" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">Противоположные стороны равны и параллельны:</text>
<text x="750.0" y="438.0" fill="#e9f1f4" font-size="24" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">каждая — сдвиг другой на ω₁ или ω₂</text>
