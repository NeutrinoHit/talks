<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 470" width="1500" height="470" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
