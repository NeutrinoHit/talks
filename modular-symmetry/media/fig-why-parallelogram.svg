<text x="235.0" y="60.0" fill="#e9f1f4" font-size="30" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">Любой четырёхугольник?</text>
<text x="235.0" y="405.0" fill="#ff9d9d" font-size="24" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">Противоположные стороны не равны</text>
<text x="235.0" y="438.0" fill="#ff9d9d" font-size="24" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">и не параллельны — сдвигом не склеить</text>
