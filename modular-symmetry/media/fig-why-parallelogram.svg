<text x="1235.0" y="405.0" fill="#e9f1f4" font-size="24" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">Тоже подходит: три пары сторон,</text>
<text x="1235.0" y="438.0" fill="#e9f1f4" font-size="24" text-anchor="middle" font-family="Source Sans Pro, Helvetica, Arial, sans-serif" font-weight="normal">каждая пара — сдвиг. Тот же тор.</text>
