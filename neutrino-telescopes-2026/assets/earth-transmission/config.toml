# Earth transmission of neutrinos, charged-current absorption only (slide "Transparent Universe, opaque Earth").

# CSMS, arXiv:1106.3723, Tables I-II (HERAPDF1.5 NLO, isoscalar nucleons), pb.
[cross_sections]
energy_gev = [1e1, 2e1, 5e1, 1e2, 2e2, 5e2, 1e3, 2e3, 5e3, 1e4, 2e4, 5e4, 1e5, 2e5, 5e5, 1e6, 2e6, 5e6, 1e7, 2e7, 5e7, 1e8]
# below 50 GeV: linear in E (sigma/E constant, as the table's lowest rows)
nu_cc_pb = [0.064, 0.128, 0.32, 0.65, 1.3, 3.2, 6.2, 12, 27, 47, 77, 140, 210, 310, 490, 690, 950, 1400, 1900, 2600, 3700, 4800]
antinu_cc_pb = [0.030, 0.060, 0.15, 0.33, 0.69, 1.8, 3.6, 7, 17, 31, 55, 110, 180, 270, 460, 660, 920, 1400, 1900, 2500, 3700, 4800]
cm2_per_pb = 1e-36
nucleons_per_gram = 6.02214076e23

[earth]
radius_km = 6371.0
detector_depth_km = 1.0
path_steps = 4000

[grid]
log10_e_min = 1.0
log10_e_max = 8.0
energies = 281
zenith_min_deg = 90.0
zenith_max_deg = 180.0
zeniths = 361
contours = [0.1, 0.5, 0.9]

[plot]
width_in = 11.5
height_in = 6.6
font_size = 17
background = "#000000"
foreground = "#eeeeee"
grid = "#344250"
colours = [[0.004, 0.008, 0.020], [0.05, 0.12, 0.30], [0.12, 0.42, 0.75], [0.45, 0.88, 1.00], [0.95, 0.99, 1.00]]
contour_colour = "#ffd166"

[tomography]
# Earth tomography contrast: PREM against a homogeneous Earth of the same mass, CC absorption only (as above).
profile_energies_tev = [10.0, 30.0, 100.0]
profile_colours = ["#73c7ff", "#ffd166", "#ff8a5c"]
contrast_limit = 0.5                     # colour range of (T_PREM - T_hom) / T_hom
contrast_contours = [-0.3, -0.1, 0.1]
log10_e_min = 3.0
log10_e_max = 6.5
energies = 141
zeniths = 361
width_in = 15.5
height_in = 6.4
diverging = ["#ff8a5c", "#3a1e18", "#000000", "#123a5a", "#73c7ff"]
