lang: ru-RU
format:
  revealjs:
    theme: [black, ../shared/styles/neutrinohit-reveal.scss]
    css:
      - ../shared/reveal/neutrinohit-reveal-quiz.css
    logo: ../shared/reveal/dvnlogo.png
    # This installed Reveal/Pandoc template initializes the MathJax 2 plugin.
    # Match its engine URL instead of loading MathJax 3 through that plugin.
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js
    include-after-body:
      - ../analytics/cloudflare-web-analytics.html
      - text: |
          <script data-external="1" data-context-home="https://neutrinohit.github.io/ru/outreach.html#neutrino-telescopes" data-context-home-label="Материалы о нейтринных телескопах" src="../shared/reveal/neutrinohit-reveal-footer.js"></script>
          <script data-external="1" src="../shared/reveal/neutrinohit-video-seek.js"></script>
          <script data-external="1" src="media/nerpa/nerpa.js"></script>
    embed-resources: false
    width: 1600
    height: 900
    margin: 0.06
    slide-number: c/t
    slide-level: 2
    toc: false
    center: false
    transition: fade
    incremental: false
    preview-links: false
    chalkboard: false
    navigation-mode: linear
    menu: true
execute:
  echo: false
  warning: false
  message: false
